name: Crear APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar descarga
        run: cp app/build/outputs/apk/debug/app-debug.apk Flor_para_Sandra.apk

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0 >/dev/null 2>&1; then
            gh release upload v1.0 Flor_para_Sandra.apk --clobber
          else
            gh release create v1.0 Flor_para_Sandra.apk --title "Flor para Sandra" --notes "Aplicación romántica para Sandra Moreira."
          fi
